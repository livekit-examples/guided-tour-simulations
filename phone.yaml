# Happy-path calls for a phone simulation: the simulated caller dials Front
# Desk's real phone number and talks to the deployed agent over the same SIP
# path a real caller takes.
#
#   lk agent simulate audio --scenarios phone.yaml \
#     --to +1XXXXXXXXXX --from +1XXXXXXXXXX --trunk ST_xxxx
#
# A phone run reaches the production agent, so there's no seeded calendar and
# no mocked tools: availability comes from whatever calendar the deployment
# uses. That's why these scenarios accept any offered time and are graded on
# the conversation alone, with no userdata.
id: SCNG_4YPUJasnPWlg
name: Front Desk by phone
scenarios:
  - id: SCN_afkkoYPHqnxA
    label: Books the first time offered next week
    instructions: |-
      You are Jordan Ellis (email jordan.ellis@example.com), calling from your
      car on a short break. You are friendly and in a bit of a hurry.

      Goals:
      - Say you'd like to come in sometime next week.
      - Accept the first time the agent offers, any weekday works for you.
      - When asked, give your email address, spelling it out if the agent
        asks you to.
      - Once the agent confirms the appointment, thank them and hang up.
    agent_expectations: The agent greets the caller, offers a few concrete
      times from its calendar, collects and confirms an email address, and
      clearly confirms the day and time of the single appointment it booked.
      Replies are short and conversational, as suits a phone call.
    tags:
      feature: booking
      channel: phone

  - id: SCN_YhQo5lJM8DNs
    label: Asks for an afternoon, then books
    instructions: |-
      You are Morgan Reyes (email morgan.reyes@example.com). You are calm and
      polite, and you can only come in the afternoon.

      Goals:
      - Ask whether there's anything available in an afternoon in the next two
        weeks.
      - Choose one of the afternoon times the agent offers.
      - Give your email address when asked and confirm it is correct.
      - End the call once the booking is confirmed.
    agent_expectations: The agent offers only afternoon times it actually has,
      books the one the caller chooses after collecting an email address, and
      confirms the appointment. If it has no afternoon times, it says so plainly
      instead of inventing one.
    tags:
      feature: booking
      channel: phone
