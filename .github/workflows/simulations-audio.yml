# Audio simulations nightly, and on demand from the Actions tab.
#
# Audio mode runs the same scenarios through the full speech pipeline: the
# simulated caller speaks, listens and interrupts, and the run scores the latency
# the caller hears, turn-taking, interruption handling and transcription of
# names, numbers and email addresses. It runs in real time and calls the STT and
# TTS providers every turn, so it runs on a schedule rather than on every change.
#
# Needs LIVEKIT_URL, LIVEKIT_API_KEY and LIVEKIT_API_SECRET repository secrets.
name: Simulations (audio)

on:
  # Runs at 06:00 UTC every day.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    env:
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Download model files
        run: uv run src/agent.py download-files

      - name: Install the LiveKit CLI
        run: curl -sSL https://get.livekit.io/cli | bash

      - name: Run simulations
        run: lk agent simulate audio --scenarios scenarios.yaml --concurrency 5
