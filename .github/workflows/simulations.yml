# Text simulations on every pull request and every merge to main.
#
# Text mode drops STT and TTS, so a run checks Front Desk's LLM, tools and
# conversation logic in a couple of minutes, and its LLM requests yield to live
# traffic on the project. Each scenario runs 3 times and must pass 2 of 3, so one
# unlucky sample doesn't block a merge but a real regression does.
#
# Needs LIVEKIT_URL, LIVEKIT_API_KEY and LIVEKIT_API_SECRET repository secrets.
name: Simulations (text)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    env:
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Download model files
        run: uv run src/agent.py download-files

      - name: Install the LiveKit CLI
        run: curl -sSL https://get.livekit.io/cli | bash

      - name: Run simulations
        run: lk agent simulate text --scenarios scenarios.yaml --samples 3 --concurrency 5
